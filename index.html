        html,

        .maps {
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }

        .marker {
            position: absolute;
            cursor: pointer;
            transform: translate(-50%, calc(-100% + 2px));
        }

        .marker svg {
            display: block;
        }

        .marker__background {
            filter: drop-shadow(0px 2px 6px rgba(24, 27, 34, 0.4));
        }

        .marker__stroke {
            position: absolute;
            transform: translate(-50%, -50%);
            z-index: -1;
            left: 50%;
            top: 50%;
        }

        .marker__icon {
            position: absolute;
            transform: translate(-50%, -50%);
            left: 50%;
            top: 50%;
        }

        .marker__icon-inner {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #ffffff;
        }

        .marker__popup {
            position: absolute;
            left: 50%;
            bottom: calc(100% + 12px);
            transform: translateX(-50%);
            min-width: 220px;
            max-width: 260px;
            background: #fff;
            border-radius: 8px;
            padding: 10px 12px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 12px;
            line-height: 1.4;
            z-index: 10;
            color: black;
        }

        .marker__popup-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .marker__popup-close {
            border: none;
            background: transparent;
            font-size: 16px;
            cursor: pointer;
            line-height: 1;
        }

        .marker__popup-line+.marker__popup-line {
            margin-top: 2px;
        }

        .marker__popup-label {
            font-weight: 600;
            margin-right: 4px;
        }

        function buildMarker(properties = {}) {
            const element = document.createElement("div");
            element.className = "marker";
            element.title = properties.city || properties.org || "";

            element.style.color = "#E63D2E";

            const icon = properties.icon || iconUrl;

            const bg = document.createElement("div");
            bg.className = "marker__background";
            bg.innerHTML = `
<svg width="32" height="40" viewBox="0 0 32 40" fill="none" xmlns="http://www.w3.org/2000/svg">
<path d="M16 0C7.1632 0 0 7.1632 0 16C0 20.4168 1.7896 24.416 4.684 27.3112C7.5792 30.208 14.4 34.4 14.8 38.8C14.86 39.4597 15.3376 40 16 40C16.6624 40 17.14 39.4597 17.2 38.8C17.6 34.4 24.4208 30.208 27.316 27.3112C30.2104 24.416 32 20.4168 32 16C32 7.1632 24.8368 0 16 0Z" fill="#FF4433"/>
<path d="M15.9999 21.6004C19.0927 21.6004 21.5999 19.0932 21.5999 16.0004C21.5999 12.9076 19.0927 10.4004 15.9999 10.4004C12.9071 10.4004 10.3999 12.9076 10.3999 16.0004C10.3999 19.0932 12.9071 21.6004 15.9999 21.6004Z" fill="white"/>
</svg>
`;
            element.appendChild(bg);
            const popup = document.createElement("div");
            popup.className = "marker__popup";
            popup.style.display = "none";
            element.appendChild(popup);
            element._popup = popup;

            return element;
        }


        function buildFeature(data) {
            const { coords, element, properties } = data || {};
            return new ymaps3.YMapFeature({
                geometry: {
                    type: "Point",
                    coordinates: coords
                },
                properties,
                style: {
                    element
                }
            });
        }

        function addGeoJsonFeatures(geoJson) {
            if (!geoJson || geoJson.type !== "FeatureCollection" || !Array.isArray(geoJson.features)) {
                console.warn("Invalid GeoJSON", geoJson);
                return;
            }

            geoJson.features
                .filter((feature) =>
                    feature &&
                    feature.geometry &&
                    feature.geometry.type === "Point" &&
                    Array.isArray(feature.geometry.coordinates)
                )
                .forEach((feature, index) => {
                    const coords = feature.geometry.coordinates;
                    const properties = feature.properties || {};
                    console.log(properties,'')

                    const element = buildMarker(properties);
                    const pointFeature = buildFeature({ coords, element, properties });

                    map.addChild(pointFeature);

                    element.addEventListener("click", (event) => {
                        onMarkerClick(properties, element);
                    });;
                });

        }

            org,
            fullAddress,
            email ? `Email: ${email}` : null,
            phone ? `Тел: ${phone}` : null,
            url ? `URL: ${url}` : null,
        ].filter(Boolean);
        if (!data.length) return;
        return;
    }

    const popup = markerElement._popup;

    // повторный клик по маркеру — закрываем
    if (popup.style.display === "block") {
        popup.style.display = "none";
        currentOpenPopup = null;
        return;
    }

    if (currentOpenPopup && currentOpenPopup !== popup) {
        currentOpenPopup.style.display = "none";
    }

    const { city, org, fullAddress, email, phone, url } = properties;
    const title = org || city || "Organization";

    popup.innerHTML = `
<div class="marker__popup-header">
  <div class="marker__popup-title">${title}</div>
  <button type="button" class="marker__popup-close" aria-label="Close">&times;</button>
</div>
<div class="marker__popup-body">
  ${city ? `<div class="marker__popup-line"><span class="marker__popup-label">City:</span> ${city}</div>` : ""}
  ${fullAddress ? `<div class="marker__popup-line"><span class="marker__popup-label">Address:</span> ${fullAddress}</div>` : ""}
  ${email ? `<div class="marker__popup-line"><span class="marker__popup-label">Email:</span> ${email}</div>` : ""}
  ${phone ? `<div class="marker__popup-line"><span class="marker__popup-label">Phone:</span> ${phone}</div>` : ""}
  ${url ? ` <a href="${url}" target="_blank" rel="noopener noreferrer">Подробнее</a>` : ""}
</div>
`;

    popup.style.display = "block";
    currentOpenPopup = popup;
    popup.addEventListener("click", (e) => e.stopPropagation());

    const closeBtn = popup.querySelector(".marker__popup-close");
    if (closeBtn) {
        closeBtn.onclick = (ev) => {
            ev.stopPropagation();
            popup.style.display = "none";
            if (currentOpenPopup === popup) {
                currentOpenPopup = null;
            }
        };
    }
}

        const getGeoJsonBounds = (geoJson) => {
            const coords = geoJson?.features
                ?.map((f) => f?.geometry?.coordinates)
                ?.filter((c) => Array.isArray(c) && c.length === 2)
                ?.filter(([lng, lat]) => Number.isFinite(lng) && Number.isFinite(lat));

            if (!coords?.length) return null;


            const [minLng, maxLng, minLat, maxLat] = coords.reduce(
                ([minLng, maxLng, minLat, maxLat], [lng, lat]) => [
                    minLng === null || lng < minLng ? lng : minLng,
                    maxLng === null || lng > maxLng ? lng : maxLng,
                    minLat === null || lat < minLat ? lat : minLat,
                    maxLat === null || lat > maxLat ? lat : maxLat
                ],
                [null, null, null, null]
            );

            return [
                [minLng, minLat],
                [maxLng, maxLat]
            ];
        };

        const fitBounds = (bounds, duration = 400) => {
            if (!bounds) return;

            map.update({
                location: {
                    bounds,
                    easing: 'ease-in-out',
                    duration
                }
            });
        };


        async function onInitMaps() {
            const { YMap, YMapDefaultSchemeLayer, YMapDefaultFeaturesLayer } = ymaps3;

            const container = document.getElementById("maps");

            map = new YMap(container, mapOptions);

            map.addChild(new YMapDefaultSchemeLayer());
            map.addChild(new YMapDefaultFeaturesLayer());

            addGeoJsonFeatures(pointsGeoJson);


            const bounds = getGeoJsonBounds(pointsGeoJson);
            if (bounds) {
                fitBounds(bounds);
            }


        }

        const YMAPS_SCRIPT_ID = "ymaps3Script";
        let ymapsLoading = null;

        const buildYMapsSrc = (config = {}) => {
            const { enterprise = false, version = "v3", ...params } = config;
            const query = Object.entries(params)
                .map(([key, value]) => `${encodeURIComponent(key)}=${encodeURIComponent(value)}`)
                .join("&");

            return `https://${enterprise ? "enterprise." : ""}api-maps.yandex.ru/${version}/?${query}`;
        };

        const createYMapsScript = (src) => {
            const script = document.createElement("script");
            script.id = YMAPS_SCRIPT_ID;
            script.async = true;
            script.defer = true;
            script.src = src;
            return script;
        };

        const ensureReady = () =>
            window.ymaps3?.ready
                ? window.ymaps3.ready.then(() => window.ymaps3)
                : Promise.resolve(window.ymaps3);

        const loadYMaps = (config = {}) => {
            if (window.ymaps3?.ready) return Promise.resolve(window.ymaps3);
            if (ymapsLoading) return ymapsLoading;

            const handleLoad = (resolve) => () => ensureReady().then(resolve);

            const existing = document.getElementById(YMAPS_SCRIPT_ID);
            if (existing) {
                ymapsLoading = new Promise((resolve, reject) => {
                    existing.addEventListener("load", handleLoad(resolve), { once: true });
                    existing.addEventListener("error", reject, { once: true });
                });
                return ymapsLoading;
            }

            const script = createYMapsScript(buildYMapsSrc(config));

            ymapsLoading = new Promise((resolve, reject) => {
                script.addEventListener("load", handleLoad(resolve), { once: true });
                script.addEventListener("error", reject, { once: true });
            });

            document.head.appendChild(script);

            return ymapsLoading;
        };

        function onReady() {
            loadYMaps(YMAPS_CONFIG)
                .then(() => ymaps3.ready.then(onInitMaps))
                .catch((error) => console.error("Error maps:", error));
        }

        document.addEventListener("DOMContentLoaded", onReady);

    </script>
