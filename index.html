        function createMarkerTemplate(properties = {}) {
            const tpl = document.getElementById("yandex-marker-template");
            const el = tpl.content.firstElementChild.cloneNode(true);

            const img = el.querySelector(".search-placemark-icon__img");
            const title = el.querySelector(".search-placemark-title__title-text");
            const ratingWrap = el.querySelector(".search-placemark-title__title-rating");
            const rating = el.querySelector(".search-placemark-title-modular-hint-view__rating");
            const subtitleWrap = el.querySelector(".search-placemark-title__subtitle");
            const subtitle = el.querySelector(".search-placemark-title__subtitle-item");

            img.src =
                properties.icon ||
                "https://avatars.mds.yandex.net/get-tycoon/15585542/27401508_pin_search_standard_2025-10-03T16_28_10/pin_x2";

            // title.textContent = properties.org || properties.city || "Организация";

            if (properties.rating) {
                ratingWrap.hidden = false;
                rating.textContent = properties.rating;
            }

            if (properties.worktime) {
                subtitleWrap.hidden = false;
                subtitle.textContent = properties.worktime;
            }

            return el;
        }

        function buildMarker(properties = {}) {
            const element = createMarkerTemplate(properties);
            return element;
        }

        function buildFeature(data) {
            const { coords, element, properties } = data || {};
            return new ymaps3.YMapFeature({
                geometry: {
                    type: "Point",
                    coordinates: coords
                },
                properties,
                style: {
                    element
                }
            });
        }

        function addGeoJsonFeatures(geoJson) {
            if (!geoJson || geoJson.type !== "FeatureCollection" || !Array.isArray(geoJson.features)) {
                console.warn("Invalid GeoJSON", geoJson);
                return;
            }

            if (!YMapClustererClass || !clusterByGridMethod || !map) {
                console.warn("Clusterer is not ready");
                return;
            }

            // Готовим массив Feature'ов для кластеризатора
            const features = geoJson.features
                .filter((feature) =>
                    feature &&
                    feature.geometry &&
                    feature.geometry.type === "Point" &&
                    Array.isArray(feature.geometry.coordinates)
                )
                .map((feature, index) => {
                    const coords = feature.geometry.coordinates;
                    const properties = feature.properties || {};

                    // создаём DOM-элемент маркера сразу, повесим обработчик клика
                    const element = buildMarker(properties);

                    element.addEventListener("click", () =>
                        onMarkerClick(properties, element, coords)
                    );

                    return {
                        type: "Feature",
                        id: properties.id != null ? properties.id : `f-${index}`,
                        geometry: {
                            type: "Point",
                            coordinates: coords
                        },
                        properties: {
                            ...properties,
                            _markerElement: element // пробрасываем DOM внутрь feature
                        }
                    };
                });

            if (!features.length) return;

            if (!clusterer) {
                // Создаём кластеризатор один раз
                clusterer = new YMapClustererClass({
                    method: clusterByGridMethod({ gridSize: 200 }),

                    features,

                    // Одиночный маркер
                    marker: (feature) => {
                        const props = feature.properties || {};
                        const coords = feature.geometry.coordinates;
                        const element = props._markerElement || buildMarker(props);

                        // На всякий случай — если пришёл без обработчика
                        if (!element._popupBound) {
                            element.addEventListener("click", () =>
                                onMarkerClick(props, element, coords)
                            );
                            element._popupBound = true;
                        }

                        return new ymaps3.YMapMarker(
                            {
                                coordinates: coords
                            },
                            element
                        );
                    },

                    // Маркер кластера
                    cluster: (coordinates, clusterFeatures) => {
                        const clusterElement = document.createElement("div");
                        clusterElement.className = "marker cluster-marker";

                        const content = document.createElement("div");
                        content.className = "marker__content cluster-marker__content";
                        content.textContent = String(clusterFeatures.length);

                        clusterElement.appendChild(content);

                        return new ymaps3.YMapMarker(
                            {
                                coordinates,
                                onClick() {
                                    // При клике зуммируемся к кластеру
                                    if (!map) return;
                                    map.update({
                                        location: {
                                            center: coordinates,
                                            zoom: Math.min((map.zoom || 5) + 2, 22),
                                            duration: 400,
                                            easing: "ease-in-out"
                                        }
                                    });
                                }
                            },
                            clusterElement
                        );
                    }
                });

                map.addChild(clusterer);
            } else {
                // Обновление набора точек, если понадобится
                clusterer.update({ features });
            }
        }

        const normalizePhone = (phone) =>
            typeof phone === "string" ? phone.replace(/[^\d+]/g, "") : phone || "";

        const buildPopupTemplate = (props = {}) => {
            const tpl = document.getElementById("popup-template");
            const node = tpl.content.cloneNode(true);

            const { city, org, fullAddress, email, phone } = props;
            const title = org || city || "Организация";
            const cleanPhone = normalizePhone(phone);

            node.querySelector(".marker__popup-title").textContent = title;

            if (city) {
                const el = node.querySelector(".popup-city");
                el.hidden = false;
                el.querySelector(".popup-city-value").textContent = city;
            }

            if (fullAddress) {
                const el = node.querySelector(".popup-address");
                el.hidden = false;
                el.querySelector(".popup-address-value").textContent = fullAddress;
            }

            if (email) {
                const el = node.querySelector(".popup-email");
                el.hidden = false;
                el.querySelector(".popup-email-value").textContent = email;
            }

            if (phone) {
                const el = node.querySelector(".popup-phone");
                el.hidden = false;
                const link = el.querySelector(".popup-phone-value");
                link.textContent = phone;
                link.href = `tel:${cleanPhone}`;
            }

            const wrapper = document.createElement("div");
            wrapper.appendChild(node);

            return wrapper.innerHTML.trim();
        };


        function buildPopupContent(properties = {}) {
            const contentEl = document.createElement("div");
            contentEl.className = "marker__popup-content";
            contentEl.innerHTML = buildPopupTemplate(properties);

            const closeBtn = contentEl.querySelector(".marker__popup-close");
            closeBtn.addEventListener("click", () => onClosePopup());

            return contentEl;
        }

        function onClosePopup() {
            if (currentPopup && map) {
                map.removeChild(currentPopup);
                currentPopup = null;
            }
        }

        function onOpenPopup(properties = {}, coords) {
            if (!coords || !Array.isArray(coords)) return;
            if (!popup || !map) return;

            onClosePopup();

            currentPopup = new popup({
                coordinates: coords,
                draggable: false,
                offset: 55,
                show: true,
                content: () => buildPopupContent(properties)
            });

            map.addChild(currentPopup);
        }

        function onMarkerClick(properties = {}, markerElement, coords) {
            const { city, org, fullAddress, email, phone, url } = properties;
            const data = [
                city,
                org,
                fullAddress,
                email ? `Email: ${email}` : null,
                phone ? `Тел: ${phone}` : null,
                url ? `URL: ${url}` : null,
            ].filter(Boolean);

            if (!data.length) return;

            // onOpenPopup(properties, coords);
        }

        const getGeoJsonBounds = (geoJson) => {
            const coords = geoJson?.features
                ?.map((f) => f?.geometry?.coordinates)
                ?.filter((c) => Array.isArray(c) && c.length === 2)
                ?.filter(([lng, lat]) => Number.isFinite(lng) && Number.isFinite(lat));

            if (!coords?.length) return null;


            const [minLng, maxLng, minLat, maxLat] = coords.reduce(
                ([minLng, maxLng, minLat, maxLat], [lng, lat]) => [
                    minLng === null || lng < minLng ? lng : minLng,
                    maxLng === null || lng > maxLng ? lng : maxLng,
                    minLat === null || lat < minLat ? lat : minLat,
                    maxLat === null || lat > maxLat ? lat : maxLat
                ],
                [null, null, null, null]
            );

            return [
                [minLng, minLat],
                [maxLng, maxLat]
            ];
        };

        const fitBounds = (bounds, duration = 400) => {
            if (!bounds) return;

            map.update({
                location: {
                    bounds,
                    easing: 'ease-in-out',
                    duration
                }
            });
        };

        async function onInitMaps() {
            const { YMap, YMapDefaultSchemeLayer, YMapDefaultFeaturesLayer } = ymaps3;
            const { YMapPopupMarker } = await ymaps3.import('@yandex/ymaps3-default-ui-theme');
            popup = YMapPopupMarker;

            // NEW: импорт кластеризатора
            const { YMapClusterer, clusterByGrid } = await ymaps3.import('@yandex/ymaps3-clusterer');
            YMapClustererClass = YMapClusterer;
            clusterByGridMethod = clusterByGrid;

            const container = document.getElementById("maps");

            map = new YMap(container, mapOptions);

            map.addChild(new YMapDefaultSchemeLayer());
            map.addChild(new YMapDefaultFeaturesLayer());

            addGeoJsonFeatures(datGeoJson);

            fitBounds(getGeoJsonBounds(datGeoJson));

        }

        const buildYMapsSrc = (config = {}) => {
            const { enterprise = false, version = "v3", ...params } = config;
            const query = Object.entries(params)
                .map(([key, value]) => `${encodeURIComponent(key)}=${encodeURIComponent(value)}`)
                .join("&");

            return `https://${enterprise ? "enterprise." : ""}api-maps.yandex.ru/${version}/?${query}`;
        };

        const createYMapsScript = (src) => {
            const script = document.createElement("script");
            script.id = YMAPS_SCRIPT_ID;
            script.async = true;
            script.defer = true;
            script.src = src;
            return script;
        };

        const ensureReady = () =>
            window.ymaps3?.ready
                ? window.ymaps3.ready.then(() => window.ymaps3)
                : Promise.resolve(window.ymaps3);

        const loadYMaps = (config = {}) => {
            if (window.ymaps3?.ready) return Promise.resolve(window.ymaps3);
            if (ymapsLoading) return ymapsLoading;

            const handleLoad = (resolve) => () => ensureReady().then(resolve);

            const existing = document.getElementById(YMAPS_SCRIPT_ID);
            if (existing) {
                ymapsLoading = new Promise((resolve, reject) => {
                    existing.addEventListener("load", handleLoad(resolve), { once: true });
                    existing.addEventListener("error", reject, { once: true });
                });
                return ymapsLoading;
            }

            const script = createYMapsScript(buildYMapsSrc(config));

            ymapsLoading = new Promise((resolve, reject) => {
                script.addEventListener("load", handleLoad(resolve), { once: true });
                script.addEventListener("error", reject, { once: true });
            });

            document.head.appendChild(script);

            return ymapsLoading;
        };

        const onReady = () =>
            loadYMaps(YMAPS_CONFIG)
                .then(() => ymaps3.ready)
                .then(() => (
                    ymaps3.import.registerCdn(
                        'https://cdn.jsdelivr.net/npm/{package}',
                        [
                            '@yandex/ymaps3-default-ui-theme@latest',
                            '@yandex/ymaps3-clusterer@0.0' // NEW: кластеризатор
                        ]
                    ),
                    onInitMaps()
                ))
                .catch(err => console.error("Error maps:", err));

        document.addEventListener("DOMContentLoaded", onReady);

    </script>
</body>

</html>
