<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>Ymaps Points</title>
</head>

<body>

    <div
        id="maps"
        class="maps"
    ></div>

    <style>

        :root {
    --ymaps3-default-offset: 50px;
}
        html,
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100%;
            width: 100%;
        }

        .maps {
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }

        .marker {
            position: absolute;
            cursor: pointer;
            transform: translate(-50%, calc(-100% + 2px));
            z-index: 1
        }


        

        .marker svg {
            display: block;
        }

        .marker__background {
            filter: drop-shadow(0px 2px 6px rgba(24, 27, 34, 0.4));
        }

        .marker__stroke {
            position: absolute;
            transform: translate(-50%, -50%);
            z-index: -1;
            left: 50%;
            top: 50%;
        }

        .marker__icon {
            position: absolute;
            transform: translate(-50%, -50%);
            left: 50%;
            top: 50%;
        }

        .marker__icon-inner {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #ffffff;
        }

       .marker__popup {
        position: fixed; /* Меняем на fixed */
        left: 50%;
        bottom: calc(100% + 12px);
        transform: translateX(-50%);
        min-width: 220px;
        max-width: 260px;
        background: #fff;
        border-radius: 8px;
        padding: 10px 12px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 12px;
        line-height: 1.4;
        z-index: 10000;
        color: black;
        pointer-events: auto;
    }

        .marker__popup-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .marker__popup-close {
            border: none;
            background: transparent;
            font-size: 16px;
            cursor: pointer;
            line-height: 1;
        }

        .marker__popup-line+.marker__popup-line {
            margin-top: 2px;
        }

        .marker__popup-label {
            font-weight: 600;
            margin-right: 4px;
        }


        .popup {
    display: flex;
    flex-direction: column;
    row-gap: 8px;
}

.header {
    display: flex;
    flex-direction: row;
    justify-content: space-between;
    gap: 8px;
    padding-right: 20px;

    .header_title {
        font-size: 16px;
        font-weight: 400;
        line-height: 22px;
        color: #050d33;
    }
    .header_close {
        position: absolute;
        top: 0;
        right: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        width: 32px;
        height: 32px;
        border: none;
        background: none;
        color: #c8c9cc;
        cursor: pointer;
        background-image: url('./close.svg');
        background-position: center;
        background-repeat: no-repeat;
    }
}

.description {
    font-size: 14px;
    font-weight: 400;
    line-height: 20px;
    color: #7b7d85;
}

.action {
    width: max-content;
    padding: 12px 16px;
    border-radius: 8px;
    border: none;
    background-color: #196dff;
    transition: background-color 0.1s ease-out;
    color: #ffffff;
    text-align: center;
    cursor: pointer;
    white-space: normal;

    font-size: 14px;
    font-style: normal;
    font-weight: 500;
    line-height: 16px;
}

.action:hover {
    background-color: #4183ff;
}

        bg.innerHTML = iconSvg;
        element.appendChild(bg);

    function buildPopup(element) {
        const popup = document.createElement("div");
        popup.className = "marker__popup";
        popup.style.display = "none";
        popup.style.zIndex = "10000";

        element.appendChild(popup);
        element._popup = popup;

        return popup;
    }

    function buildMarker(properties = {}) {
        const element = createMarkerElement(properties);
        buildPopup(element);
        return element;
    }


    function buildFeature(data) {
        const { coords, element, properties } = data || {};
        return new ymaps3.YMapFeature({
            geometry: {
                type: "Point",
                coordinates: coords
            },
            properties,
            style: {
                element
            }
        });
    }


    function addGeoJsonFeatures(geoJson) {
        if (!geoJson || geoJson.type !== "FeatureCollection" || !Array.isArray(geoJson.features)) {
            console.warn("Invalid GeoJSON", geoJson);
            return;
        }

        geoJson.features
            .filter((feature) =>
                feature &&
                feature.geometry &&
                feature.geometry.type === "Point" &&
                Array.isArray(feature.geometry.coordinates)
            )
            .forEach((feature, index) => {
                const coords = feature.geometry.coordinates;
                const properties = feature.properties || {};

                const element = buildMarker(properties);
                const pointFeature = buildFeature({ coords, element, properties });

                map.addChild(pointFeature);

               element.addEventListener("click", () => onMarkerClick({...properties,coords}, element));
            });
    }

    const getGeoJsonBounds = (geoJson) => {
        const coords = geoJson?.features
            ?.map((f) => f?.geometry?.coordinates)
            ?.filter((c) => Array.isArray(c) && c.length === 2)
            ?.filter(([lng, lat]) => Number.isFinite(lng) && Number.isFinite(lat));

        if (!coords?.length) return null;


        const [minLng, maxLng, minLat, maxLat] = coords.reduce(
            ([minLng, maxLng, minLat, maxLat], [lng, lat]) => [
                minLng === null || lng < minLng ? lng : minLng,
                maxLng === null || lng > maxLng ? lng : maxLng,
                minLat === null || lat < minLat ? lat : minLat,
                maxLat === null || lat > maxLat ? lat : maxLat
            ],
            [null, null, null, null]
        );

        return [
            [minLng, minLat],
            [maxLng, maxLat]
        ];
    };

    const fitBounds = (bounds, duration = 400) => {
        if (!bounds) return;

        map.update({
            location: {
                bounds,
                easing: 'ease-in-out',
                duration
            }
        });
    };


    async function onInitMaps() {
        const { YMap, YMapDefaultSchemeLayer, YMapDefaultFeaturesLayer } = ymaps3;
        const { YMapPopupMarker } = await ymaps3.import('@yandex/ymaps3-default-ui-theme');
YMapPopupMarkerClass = YMapPopupMarker;

        map = new YMap(container, mapOptions);

        map.addChild(new YMapDefaultSchemeLayer());
        map.addChild(new YMapDefaultFeaturesLayer());

        addGeoJsonFeatures(pointsGeoJson);

        fitBounds(getGeoJsonBounds(pointsGeoJson));

    }

    const buildYMapsSrc = (config = {}) => {
        const { enterprise = false, version = "v3", ...params } = config;
        const query = Object.entries(params)
            .map(([key, value]) => `${encodeURIComponent(key)}=${encodeURIComponent(value)}`)
            .join("&");

        return `https://${enterprise ? "enterprise." : ""}api-maps.yandex.ru/${version}/?${query}`;
    };

    const createYMapsScript = (src) => {
        const script = document.createElement("script");
        script.id = YMAPS_SCRIPT_ID;
        script.async = true;
        script.defer = true;
        script.src = src;
        return script;
    };

    const ensureReady = () =>
        window.ymaps3?.ready
            ? window.ymaps3.ready.then(() => window.ymaps3)
            : Promise.resolve(window.ymaps3);

    const loadYMaps = (config = {}) => {
        if (window.ymaps3?.ready) return Promise.resolve(window.ymaps3);
        if (ymapsLoading) return ymapsLoading;

        const handleLoad = (resolve) => () => ensureReady().then(resolve);

        const existing = document.getElementById(YMAPS_SCRIPT_ID);
        if (existing) {
            ymapsLoading = new Promise((resolve, reject) => {
                existing.addEventListener("load", handleLoad(resolve), { once: true });
                existing.addEventListener("error", reject, { once: true });
            });
            return ymapsLoading;
        }

        const script = createYMapsScript(buildYMapsSrc(config));

        ymapsLoading = new Promise((resolve, reject) => {
            script.addEventListener("load", handleLoad(resolve), { once: true });
            script.addEventListener("error", reject, { once: true });
        });

        document.head.appendChild(script);

        return ymapsLoading;
    };
